# ==============================================================================
# Restormer Deshadowing - Config optimized for Google Colab GPU Tesla T4 (15GB)
# ==============================================================================

# general settings
name: Deshadowing_Restormer_Colab_T4
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100
gpu_memory_fraction: 0.90  # Caps PyTorch allocation at ~13.5GB to avoid OOM on T4 (15GB)

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: ./Deshadowing/Datasets/train/ISTD/target
    dataroot_lq: ./Deshadowing/Datasets/train/ISTD/input
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # data loader (Note: Colab has only 2 vCPUs, num_workers must be <= 2 to avoid RAM crash)
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 4

    ### -------------Progressive training (T4 Safe: max patch 256)-------------
    mini_batch_sizes: [4, 3, 2, 1]              # Batch size per gpu
    iters: [92000, 64000, 72000, 72000]        # Total: 300,000 iterations
    gt_size: 256                                # Max patch size for progressive training
    gt_sizes: [128, 160, 192, 256]              # Patch sizes for progressive training
    ### ------------------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: ./Deshadowing/Datasets/test/ISTD/target
    dataroot_lq: ./Deshadowing/Datasets/test/ISTD/input
    io_backend:
      type: disk

# network structures
network_g:
  type: Restormer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  dual_pixel_task: False
  use_hf_branch: true    # High-Frequency Branch preserves sharp text strokes & edges

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 300000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  # Split 300k iterations into two cycles:
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [92000, 208000]
    restart_weights: [1, 1]
    eta_mins: [0.0003, 0.000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  freq_opt:
    type: FrequencyLoss
    loss_weight: 0.1
    criterion: l1

# validation settings
val:
  window_size: 8
  val_freq: !!float 2e3
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 4

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false # RGB evaluation for deshadowing

# logging settings
logger:
  print_freq: 500
  save_checkpoint_freq: !!float 2e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
